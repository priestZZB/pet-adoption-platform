# ============================================================
# 宠物领养平台 — Nginx 生产环境参考配置
# 服务器路径：/www/wwwroot/pet-adoption/
# 部署时将此配置 include 到主 nginx.conf 或 sites-enabled 中
# ============================================================

server {
    listen 80;
    server_name adopt.priestlab.top;   # 替换为实际域名

    # --------------------------------------------------------
    # 0. 真实客户端 IP 识别
    #
    # Cloudflare CDN 用户（推荐）：
    #   1. 创建 /etc/nginx/cloudflare-ip.conf，内容来自：
    #      https://www.cloudflare.com/ips-v4/
    #      https://www.cloudflare.com/ips-v6/
    #   2. 取消下面两行注释
    # --------------------------------------------------------
    # include /etc/nginx/cloudflare-ip.conf;
    # real_ip_header CF-Connecting-IP;

    # 通用方案（无CDN或已信任的上游代理）：
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    # --------------------------------------------------------
    # 1. 前端静态资源（Vue SPA）
    # --------------------------------------------------------
    root /www/wwwroot/pet-adoption/frontend/dist;
    index index.html;

    # --------------------------------------------------------
    # 2.  /uploads/ — 上传文件代理（必须配置！）
    #
    # 说明：用户上传的图片存储在服务器 /data/pet-adoption/uploads/
    #       Spring Boot 通过 WebMvcConfig 将 /uploads/** 映射到该目录。
    #       但生产环境前端由 Nginx 直接托管，/uploads/ 请求默认不会
    #       到达 Spring Boot，必须显式代理。
    #
    # 影响：如果缺少此配置，全站所有上传图片都无法显示：
    #       - 首页轮播图 / 登录页轮播图
    #       - 宠物图片 / 用户头像
    #       - 商品主图 / 评价图片
    #       - 聊天图片 / 反馈图片 / 志愿者回访图片
    #       - 评论图片
    # --------------------------------------------------------
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 上传文件通常较大，适当增加超时
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --------------------------------------------------------
    # 3. /api/ — 后端 API 代理
    # --------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 文件上传大小限制
        client_max_body_size 50m;
    }

    # --------------------------------------------------------
    # 4. Vue Router History 模式 — SPA fallback
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------
    # 5. 安全加固（可选）
    # --------------------------------------------------------
    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
    }
    location ~ \.(yml|yaml|properties|sql|log)$ {
        deny all;
    }
}
