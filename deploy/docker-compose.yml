# ============================================================
# 宠物领养救助管理平台 — Docker Compose 部署
# 内存 1.6G 优化版：各容器限制资源防OOM
# 使用方式：
#   1. 构建本地项目（在项目根目录执行）
#      mvn clean package -DskipTests
#      cd frontend && npm run build
#
#   2. 复制文件到部署目录
#      copy pet-gateway/target/pet-gateway-1.0.0.jar deploy/
#      copy -r frontend/dist deploy/frontend-dist
#
#   3. 配置 .env 文件（复制 .env.example 为 .env 填入真实值）
#   4. 复制 application-secret.yml 到 deploy/
#
#   5. 启动
#      cd deploy && docker compose up -d
# ============================================================

services:

  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: pet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: pet_adoption
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sql/migration.sql:/docker-entrypoint-initdb.d/02-migration.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: pet-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # ---------- 后端 ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pet-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据库（Docker 内部用容器名访问）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pet_adoption?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # Redis
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      # 高德 API Key
      PET_MAP_AMAP-KEY: ${AMAP_WEB_KEY}
      # AI Key
      PET_AI_API-KEY: ${DEEPSEEK_KEY}
      # 第三方服务 AppCode
      PET_THIRD-PARTY_APPCODE: ${APPCODE}
      # 上传目录（容器内路径）
      PET_UPLOAD_PATH: /data/pet-adoption/uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads-data:/data/pet-adoption/uploads
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ---------- 前端 ----------
  frontend:
    image: nginx:alpine
    container_name: pet-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

volumes:
  mysql-data:
  redis-data:
  uploads-data:
