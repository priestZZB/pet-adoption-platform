# 生产环境配置
# 使用方式：--spring.profiles.active=prod
# ===============================================
server:
  port: 8080

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pet_adoption?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # password 在 application-secret.yml
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 16
        max-wait: -1ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath*:com/pet/**/mapper/xml/*.xml
  type-aliases-package: com.pet.**.model.entity
  configuration:
    map-underscore-to-camel-case: true
    lazy-loading-enabled: true
    aggressive-lazy-loading: false

logging:
  level:
    com.pet: info
    org.springframework: warn

pet:
  login:
    max-attempts: 5
    lock-minutes: 15

  ai:
    model: "deepseek-chat"
    api-url: "https://api.deepseek.com/chat/completions"

  jwt:
    expiration: 86400000

  sms:
    rate-limit-seconds: 60
    mock: false

  map:
    regeo-url: "https://restapi.amap.com/v3/geocode/regeo"
    inputtips-url: "https://restapi.amap.com/v3/assistant/inputtips"

  third-party:
    face:
      url: "https://kzfacev1.market.alicloudapi.com/api-mall/api/face_id_card_yi_suo/check"
    liveness:
      token-url: "https://kzlive.market.alicloudapi.com/api/liveness/h5/token"
      result-url: "https://kzlive.market.alicloudapi.com/api/liveness/h5/result"
    captcha:
      verify-url: "https://lhxwyzmjk.market.alicloudapi.com/captcha/verification_code"
    sms:
      url: "https://gyytz.market.alicloudapi.com/sms/smsSend"

  upload:
    path: /data/pet-adoption/uploads

  cors:
    allowed-origins: "https://你的域名.com"
