# ===============================================
# 生产环境配置
# 使用方式：--spring.profiles.active=prod
# ===============================================
server:
  port: 8080

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pet_adoption?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: priest
    # password 在 application-secret.yml
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  redis:
    host: localhost
    port: 6379
    password: "Zzb070104"
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 16
        max-wait: -1ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath*:com/pet/**/mapper/xml/*.xml
  type-aliases-package: com.pet.**.model.entity
  configuration:
    map-underscore-to-camel-case: true
    lazy-loading-enabled: true
    aggressive-lazy-loading: false

logging:
  level:
    com.pet: info
    org.springframework: warn

# ============================================================
# 🎛️ 模拟模式开关（默认关闭，测试临时开启）
#
#   生产环境默认全部 mock: false，走真实第三方服务
#   首次部署或调试时可临时改为 true，跳过三方依赖
#
#   mock: true → 模拟模式（适合前期验证）
#   mock: false → 真实模式（上线正式用）
# ============================================================
pet:
  # -------- 登录安全 --------
  login:
    max-attempts: 5
    lock-minutes: 15

  # -------- JWT --------
  jwt:
    expiration: 86400000

  # -------- 滑块验证码（生产默认关掉mock，走真实API）--------
  captcha:
    mock: true

  # -------- 短信验证码 --------
  sms:
    rate-limit-seconds: 60
    mock: true

  # -------- 实名认证 --------
  realname:
    mock: true

  # -------- AI智能咨询（DeepSeek）--------
  ai:
    model: "deepseek-chat"
    api-url: "https://api.deepseek.com/chat/completions"
    mock: false

  # -------- 地图服务（高德Web服务API）--------
  map:
    regeo-url: "https://restapi.amap.com/v3/geocode/regeo"
    inputtips-url: "https://restapi.amap.com/v3/assistant/inputtips"
    mock: false

  # -------- 聊天 --------
  chat:
    violation-limit: 3

  # -------- 第三方 API 地址 --------
  third-party:
    face:
      url: "https://kzfacev1.market.alicloudapi.com/api-mall/api/face_id_card_yi_suo/check"
    liveness:
      token-url: "https://kzlive.market.alicloudapi.com/api/liveness/h5/token"
      result-url: "https://kzlive.market.alicloudapi.com/api/liveness/h5/result"
    captcha:
      verify-url: "https://lhxwyzmjk.market.alicloudapi.com/captcha/verification_code"
    sms:
      url: "https://gyytz.market.alicloudapi.com/sms/smsSend"

  # -------- 文件上传路径 --------
  upload:
    path: /data/pet-adoption/uploads

  # -------- 全站维护模式 --------
  maintenance:
    enabled: true

  # -------- CORS 跨域 --------
  cors:
    allowed-origins: "https://adopt.priestlab.top"
