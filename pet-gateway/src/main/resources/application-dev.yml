# ===============================================
# 开发环境配置
# ===============================================
server:
  port: 8080

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pet_adoption?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # password 在 application-secret.yml
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 16
        max-wait: -1ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath*:com/pet/**/mapper/xml/*.xml
  type-aliases-package: com.pet.**.model.entity
  configuration:
    map-underscore-to-camel-case: true
    lazy-loading-enabled: true
    aggressive-lazy-loading: false
    # 开发打印 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.pet: debug
    org.springframework: info

# ============================================================
# 🎛️ 模拟模式开关（mock: true / false）
#
#   mock: true   → 模拟模式（开发用，不调真实三方服务）
#                   • 滑块验证码：后端直接跳过验证，返回成功
#                   • 短信验证码：控制台输出验证码，不真实发送
#                   • 实名认证：姓名+身份证校验数据库即可，不调人脸API
#                   • AI咨询：返回"AI服务暂时不可用"，不调DeepSeek
#                   • 地图服务：返回模拟数据，不调高德API
#
#   mock: false  → 真实模式（生产用，调第三方服务）
#                   删除或注释掉 mock 配置项也等同 false
# ============================================================
pet:
  # -------- 登录安全 --------
  login:
    max-attempts: 5          # 连续输错几次锁定
    lock-minutes: 15         # 锁定多少分钟

  # -------- JWT --------
  jwt:
    expiration: 86400000     # Token有效期（毫秒），24小时

  # -------- 滑块验证码 --------
  captcha:
    mock: true               # true=跳过验证 | false=调怜花API

  # -------- 短信验证码 --------
  sms:
    rate-limit-seconds: 60   # 同手机号发短信最小间隔（秒）
    mock: true               # true=控制台输出 | false=调三网短信API

  # -------- 实名认证 --------
  realname:
    mock: true               # true=模拟通过(校验DB) | false=调人脸比对API

  # -------- AI智能咨询（DeepSeek）--------
  ai:
    model: "deepseek-chat"   # DeepSeek 模型名
    api-url: "https://api.deepseek.com/chat/completions"
    mock: true               # true=返回"维护中" | false=调DeepSeek API

  # -------- 地图服务（高德Web服务API）--------
  map:
    regeo-url: "https://restapi.amap.com/v3/geocode/regeo"
    inputtips-url: "https://restapi.amap.com/v3/assistant/inputtips"
    mock: true               # true=模拟数据 | false=调高德API

  # -------- 第三方 API 地址（仅mock=false时生效）--------
  third-party:
    face:
      url: "https://kzfacev1.market.alicloudapi.com/api-mall/api/face_id_card_yi_suo/check"
    liveness:
      token-url: "https://kzlive.market.alicloudapi.com/api/liveness/h5/token"
      result-url: "https://kzlive.market.alicloudapi.com/api/liveness/h5/result"
    captcha:
      verify-url: "https://lhxwyzmjk.market.alicloudapi.com/captcha/verification_code"
    sms:
      url: "https://gyytz.market.alicloudapi.com/sms/smsSend"

  # -------- 文件上传路径 --------
  upload:
    path: D:/data/pet-adoption/uploads

  # -------- 全站维护模式 --------
  maintenance:
    enabled: false

  # -------- 聊天 --------
  chat:
    violation-limit: 3        # 累计违规几次后自动封号
