# ===============================================
# 环境选择器
# 默认使用 prod 环境（生产），include 加载 secret 密钥
#
# ⚠️ 本地开发请通过以下方式之一切换为 dev：
#    1. IDEA → Run Configuration → Environment variables:
#       SPRING_PROFILES_ACTIVE=dev
#    2. 命令行启动：
#       java -jar xxx.jar --spring.profiles.active=dev
#    3. 设置系统环境变量：
#       export SPRING_PROFILES_ACTIVE=dev
# ===============================================

spring:
  profiles:
    active: prod
    include: secret
