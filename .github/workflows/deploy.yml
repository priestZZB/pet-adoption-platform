name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 娉ㄥ叆 secret 閰嶇疆
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          mkdir -p pet-gateway/src/main/resources
          printf '%s\n' "$APP_SECRET" > pet-gateway/src/main/resources/application-secret.yml

      - name: Build Backend
        run: mvn clean package -DskipTests -U --batch-mode

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: pet-gateway/target/pet-gateway-1.0.0.jar,frontend/dist/
          target: /tmp/deploy/

      - name: Restart Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 120s
          script: |
            cp /tmp/deploy/pet-gateway/target/pet-gateway-1.0.0.jar /www/wwwroot/pet-adoption/pet-gateway/target/pet-gateway-1.0.0.jar.new
            cp -r /tmp/deploy/frontend/dist/* /www/wwwroot/pet-adoption/frontend/dist/
            mv /www/wwwroot/pet-adoption/pet-gateway/target/pet-gateway-1.0.0.jar.new /www/wwwroot/pet-adoption/pet-gateway/target/pet-gateway-1.0.0.jar
            sudo systemctl restart spring_pet-adoption.service
            rm -rf /tmp/deploy
