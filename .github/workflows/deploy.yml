name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 注入 secret 配置
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          mkdir -p pet-gateway/src/main/resources
          printf '%s\n' "$APP_SECRET" > pet-gateway/src/main/resources/application-secret.yml

      - name: Build Backend
        run: mvn clean package -DskipTests -U --batch-mode

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: pet-gateway/target/pet-gateway-1.0.0.jar,frontend/dist/
          target: /tmp/deploy/

      - name: Restart Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 120s
          script: |
            # 1️⃣ 先复制新 jar 到临时位置
            cp /tmp/deploy/pet-gateway/target/pet-gateway-1.0.0.jar /www/wwwroot/pet-adoption/pet-gateway/target/pet-gateway-1.0.0.jar.new

            # 2️⃣ 复制前端
            cp -r /tmp/deploy/frontend/dist/* /www/wwwroot/pet-adoption/frontend/dist/

            # 3️⃣ 原子替换（mv 比 cp 快几十倍，窗口期接近零）
            mv /www/wwwroot/pet-adoption/pet-gateway/target/pet-gateway-1.0.0.jar.new /www/wwwroot/pet-adoption/pet-gateway/target/pet-gateway-1.0.0.jar

            # 4️⃣ 🔍 诊断：看看各种匹配模式分别命中哪些进程
            echo "===== DIAG: pgrep -f 'pet-gateway' ====="
            pgrep -f pet-gateway -a 2>/dev/null || echo "(none)"
            echo "===== DIAG: pgrep -f 'java.*pet-gateway' ====="
            pgrep -f "java.*pet-gateway" -a 2>/dev/null || echo "(none)"
            echo "===== DIAG: pgrep -f '-Xmx1024M' ====="
            pgrep -f "-Xmx1024M" -a 2>/dev/null || echo "(none)"
            echo "===== DIAG: pgrep -f '--server.port=8080' ====="
            pgrep -f "--server.port=8080" -a 2>/dev/null || echo "(none)"
            echo "===== DIAG END ====="

            # 5️⃣ 用最精确的 pattern 杀：-Xmx1024M 是 JVM 独有参数，脚本里没有
            pkill -f "-Xmx1024M" 2>/dev/null || true

            # 6️⃣ 等宝塔检测 + 重启完成
            sleep 8

            # 7️⃣ 清理临时文件
            rm -rf /tmp/deploy
