name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 注入 secret 配置
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          mkdir -p pet-gateway/src/main/resources
          printf '%s\n' "$APP_SECRET" > pet-gateway/src/main/resources/application-secret.yml

      - name: Build Backend
        run: mvn clean package -DskipTests -U --batch-mode

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: pet-gateway/target/pet-gateway-1.0.0.jar,frontend/dist/
          target: /tmp/deploy/


      - name: Restart Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 120s
          script: |
            mkdir -p /www/wwwroot/pet-adoption/pet-gateway/target
            mkdir -p /www/wwwroot/pet-adoption/frontend/dist
            
            sudo systemctl stop spring_pet-adoption.service
            sleep 2
            
            cp /tmp/deploy/pet-gateway/target/pet-gateway-1.0.0.jar /www/wwwroot/pet-adoption/pet-gateway/target/pet-gateway-1.0.0.jar
            cp -r /tmp/deploy/frontend/dist/* /www/wwwroot/pet-adoption/frontend/dist/
            
            sudo systemctl start spring_pet-adoption.service
            sleep 5
            
            rm -rf /tmp/deploy
            
            sudo systemctl status spring_pet-adoption.service --no-pager
# ... existing code ...
