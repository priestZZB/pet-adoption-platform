# ============================================
# 宠物领养救助管理平台 — Docker Compose
# 使用：docker compose up -d
# ============================================

version: "3.8"

services:
  # --------------- MySQL ---------------
  mysql:
    image: mysql:8.0
    container_name: pet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ZZb070104}
      MYSQL_DATABASE: pet_adoption
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./pet_adoption.sql:/docker-entrypoint-initdb.d/01-pet_adoption.sql
    networks:
      - pet-network
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-ZZb070104}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------- Redis ---------------
  redis:
    image: redis:7
    container_name: pet-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-ZZb070104}
    volumes:
      - redis-data:/data
    networks:
      - pet-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ZZb070104}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------- 后端应用 ---------------
  app:
    build: .
    container_name: pet-app
    restart: unless-stopped
    # 仅本地调试时取消注释下面这行（不经过 Nginx 直接访问后端）
    # ports:
    #   - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pet_adoption?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ZZb070104}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-ZZb070104}
    volumes:
      # 挂载 secret 配置（含 API Key、JWT 密钥等敏感信息）
      - ./pet-gateway/src/main/resources/application-secret.yml:/app/application-secret.yml
      - upload-data:/data/pet-adoption/uploads
    networks:
      - pet-network

  # --------------- Nginx（前端 + API 网关）---------------
  nginx:
    build: ./frontend
    container_name: pet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - pet-network

volumes:
  mysql-data:
    name: pet-mysql-data
  redis-data:
    name: pet-redis-data
  upload-data:
    name: pet-upload-data

networks:
  pet-network:
    name: pet-network
    driver: bridge
